<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b10">
<title>Gym 30</title>
<style>
:root{--bg:#0b0b10;--card:#15151c;--card2:#1c1c25;--text:#f6f6f8;--muted:#9898a5;--accent:#c7ff45;--line:#292934}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,Arial,sans-serif}
.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 2px 18px}
.logo{font-size:25px;font-weight:800;letter-spacing:-.8px}.logo span{color:var(--accent)}
.icon{background:var(--card);border:1px solid var(--line);color:#fff;border-radius:13px;width:42px;height:42px;font-size:19px}
.hero{background:linear-gradient(145deg,#1b1b23,#111117);border:1px solid var(--line);border-radius:25px;padding:23px;margin-bottom:14px}
.heroTop{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px}
.count{font-size:48px;font-weight:850;letter-spacing:-2px;margin-top:3px}.count small{font-size:19px;color:var(--muted);font-weight:600;letter-spacing:0}
.badge{background:var(--accent);color:#101010;font-weight:800;border-radius:999px;padding:8px 11px;font-size:12px}
.progress{height:9px;background:#292932;border-radius:99px;overflow:hidden;margin-top:15px}.bar{height:100%;background:var(--accent);border-radius:99px;transition:.25s}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:18px}.day{text-align:center;font-size:11px;color:var(--muted)}.dot{height:6px;border-radius:9px;background:#30303a;margin-top:6px}.dot.done{background:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.action{border:0;border-radius:20px;padding:18px;text-align:left;color:#111;font-weight:800;font-size:16px}.weight{background:#fff}.cardio{background:var(--accent)}.action small{display:block;font-weight:500;margin-top:5px;opacity:.65}
.section{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 11px}.section h2{font-size:19px;margin:0;letter-spacing:-.4px}.section button{border:0;background:none;color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:3px 16px}.row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.name{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:4px}.value{font-weight:800}.empty{padding:25px 0;color:var(--muted);text-align:center}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:#15151c;border-radius:27px 27px 0 0;padding:20px 20px calc(25px + env(safe-area-inset-bottom));width:100%;max-width:520px;margin:auto;border:1px solid var(--line)}
.sheet h2{margin:0 0 18px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field input{width:100%;padding:15px;border-radius:13px;border:1px solid var(--line);background:#0e0e13;color:white;font-size:17px;outline:none}.field input:focus{border-color:var(--accent)}
.primary{width:100%;padding:16px;border:0;border-radius:15px;background:var(--accent);font-weight:850;font-size:16px;margin-top:9px}.cancel{width:100%;padding:14px;border:0;background:none;color:#aaa;font-size:15px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:16px;margin-top:20px}.tab{flex:1;border:0;background:none;color:#888;padding:11px;border-radius:12px;font-weight:700}.tab.active{background:var(--card2);color:#fff}
#progressView{display:none}.chart{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:10px}.chartTitle{font-weight:800;margin-bottom:10px}.chart svg{width:100%;height:190px}.chartNote{font-size:12px;color:var(--muted)}
select{width:100%;padding:13px;border-radius:12px;background:#0e0e13;color:#fff;border:1px solid var(--line);font-size:16px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">GYM<span>30</span></div><button class="icon" onclick="exportData()">↥</button></header>

<div id="homeView">
<section class="hero">
 <div class="heroTop"><div><div class="eyebrow">This week</div><div class="count"><span id="count">0</span><small> / 30</small></div></div><div id="status" class="badge">LET'S GO</div></div>
 <div class="progress"><div id="bar" class="bar" style="width:0%"></div></div>
 <div class="days" id="days"></div>
</section>

<div class="actions">
<button class="action weight" onclick="openModal('weight')">＋ Weight<small>3 sets = 1 activity</small></button>
<button class="action cardio" onclick="openModal('cardio')">＋ Cardio<small>5 mins = 1 activity</small></button>
</div>

<div class="section"><h2>Recent</h2><button onclick="clearAll()">Reset</button></div>
<div class="card" id="recent"></div>
</div>

<div id="progressView">
<div class="section"><h2>Progress</h2></div>
<select id="exerciseSelect" onchange="renderProgress()"></select>
<div id="chartArea"></div>
</div>

<div class="tabs"><button class="tab active" id="tabHome" onclick="showTab('home')">Today</button><button class="tab" id="tabProgress" onclick="showTab('progress')">Progress</button></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<h2 id="modalTitle">Add weight activity</h2>
<div class="field"><label>ACTIVITY</label><input id="activity" placeholder="e.g. Bench Press" autocomplete="off"></div>
<div class="field"><label id="valueLabel">WEIGHT (KG)</label><input id="value" type="number" inputmode="decimal" placeholder="60"></div>
<button class="primary" onclick="saveActivity()">Add activity</button>
<button class="cancel" onclick="closeModal()">Cancel</button>
</div></div>

<script>
const KEY='gym30-data-v1'; let data=JSON.parse(localStorage.getItem(KEY)||'[]'); let mode='weight';
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function monday(d){d=new Date(d);let day=d.getDay();let diff=(day===0?-6:1)-day;d.setDate(d.getDate()+diff);d.setHours(0,0,0,0);return d}
function dateKey(d){return new Date(d).toISOString().slice(0,10)}
function weekData(){let m=monday(new Date());return data.filter(x=>new Date(x.date)>=m)}
function render(){
 let w=weekData(), n=w.length, pct=Math.min(100,n/30*100); $('count').textContent=n;$('bar').style.width=pct+'%';
 $('status').textContent=n>=30?'TARGET HIT':n>=20?'GREAT WEEK':n>=10?'KEEP GOING':"LET'S GO";
 let names=['M','T','W','T','F','S','S'];let now=new Date(), mon=monday(now);
 $('days').innerHTML=names.map((x,i)=>{let d=new Date(mon);d.setDate(mon.getDate()+i);let done=w.some(a=>dateKey(a.date)===dateKey(d));return `<div class="day">${x}<div class="dot ${done?'done':''}"></div></div>`}).join('');
 let recent=[...data].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,12);
 $('recent').innerHTML=recent.length?recent.map(a=>`<div class="row"><div><div class="name">${esc(a.activity)}</div><div class="meta">${new Date(a.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${a.type==='weight'?'3 sets':'5 min cardio'}</div></div><div class="value">${a.type==='weight'?a.value+' kg':'5 min'}</div></div>`).join(''):'<div class="empty">Nothing logged yet.<br>Add your first activity above.</div>';
 renderSelect();
}
function renderSelect(){let names=[...new Set(data.filter(x=>x.type==='weight').map(x=>x.activity))];$('exerciseSelect').innerHTML=names.length?names.map(n=>`<option>${esc(n)}</option>`).join(''):'<option>No weights logged yet</option>';renderProgress()}
function renderProgress(){
 let name=$('exerciseSelect').value, rows=data.filter(x=>x.type==='weight'&&x.activity===name).sort((a,b)=>new Date(a.date)-new Date(b.date));
 if(!rows.length){$('chartArea').innerHTML='<div class="chart"><div class="chartNote">Log a weight activity to see your progress.</div></div>';return}
 let vals=rows.map(x=>Number(x.value)), max=Math.max(...vals), min=Math.min(...vals), range=Math.max(1,max-min);
 let W=420,H=170,p=22;let pts=rows.map((r,i)=>{let x=p+(rows.length===1?0:(W-2*p)*i/(rows.length-1));let y=H-p-(Number(r.value)-min)/range*(H-2*p);return [x,y]});
 let path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 let circles=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="currentColor"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="11" fill="#aaa">${vals[i]}</text>`).join('');
 $('chartArea').innerHTML=`<div class="chart"><div class="chartTitle">${esc(name)}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${circles}</svg><div class="chartNote">${vals[0]} kg → ${vals[vals.length-1]} kg · ${rows.length} sessions</div></div>`;
}
function openModal(t){mode=t;$('modalTitle').textContent=t==='weight'?'Add weight activity':'Add cardio activity';$('valueLabel').textContent=t==='weight'?'WEIGHT (KG)':'DURATION (MINUTES)';$('value').value=t==='cardio'?'5':'';$('modal').classList.add('show');setTimeout(()=>$('activity').focus(),150)}
function closeModal(){$('modal').classList.remove('show');$('activity').value='';$('value').value=''}
function saveActivity(){let activity=$('activity').value.trim();let value=Number($('value').value);if(!activity||!value)return;data.push({id:Date.now(),date:new Date().toISOString(),type:mode,activity,value});closeModal();save()}
function showTab(t){let home=t==='home';$('homeView').style.display=home?'block':'none';$('progressView').style.display=home?'none':'block';$('tabHome').classList.toggle('active',home);$('tabProgress').classList.toggle('active',!home);if(!home)renderProgress()}
function clearAll(){if(confirm('Delete all your gym data?')){data=[];save()}}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gym30-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
render();
</script>
</body>
</html>
